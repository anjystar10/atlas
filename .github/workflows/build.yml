name: Build Atlas APK

on:
  push:
    branches: [main]
    # the Windows app has its own build (desktop.yml)
    paths-ignore: ['desktop/**', '.github/workflows/desktop.yml', 'tools/smoke.sh', 'tools/seed_state.py']
  workflow_dispatch:

permissions:
  contents: write

env:
  # llama.cpp pinned to an exact commit so every build uses the same on-device model runtime.
  LLAMA_CPP_REF: 9e2a04a439edc49f08c5acdafefae19dfa25a658

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch llama.cpp (pinned)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake for llama.cpp
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: Unit tests (task and reminder engine, Gemini messages)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Unlock the signing key
        # the key is committed only encrypted; the password lives in the repository secret ATLAS_KEYSTORE_PASSWORD
        env:
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ATLAS_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the repository secret ATLAS_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ATLAS_KEYSTORE_PASSWORD \
            -in signing/atlas.jks.enc -out signing/atlas.jks
          echo "ATLAS_KEYSTORE_PASSWORD=$ATLAS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        # the model runtime downloads a dependency from GitHub while configuring; retry if that download times out
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:assembleDebug; then exit 0; fi
            echo "Build attempt $attempt failed; retrying in 30 seconds"
            rm -rf llama.cpp/examples/llama.android/lib/.cxx
            sleep 30
          done
          exit 1

      - name: Name the APK
        run: |
          mkdir -p out
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "out/Atlas-${V}-build${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact store must never stop the APK being published below
        with:
          name: atlas-apk
          path: out/*.apk
          retention-days: 3

      - name: Publish to the apk-builds branch
        run: |
          git config user.name "atlas-ci"
          git config user.email "atlas-ci@users.noreply.github.com"
          git fetch origin apk-builds || true
          git switch --orphan apk-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp out/*.apk ./Atlas-latest.apk
          git add -f Atlas-latest.apk
          echo "${GITHUB_SHA}" > built-from.txt
          git add -f built-from.txt
          git commit -m "APK from build ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f origin apk-tmp:apk-builds

      - name: Publish the release for Atlas's own update check (main only)
        # latest.json + the APK on the "releases" branch: what Atlas on the phone compares itself with (Updater.kt).
        # Only builds from main count as releases; test builds from other branches never reach anyone's phone.
        if: github.ref == 'refs/heads/main'
        run: |
          # an earlier step switched to the apk-builds branch, so read the sources from this commit, not the work tree
          git show "$GITHUB_SHA:app/build.gradle.kts" > /tmp/gradle.kts
          git show "$GITHUB_SHA:CHANGELOG.json" > /tmp/CHANGELOG.json
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' /tmp/gradle.kts | head -1)
          C=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' /tmp/gradle.kts | head -1)
          mkdir -p rel && cp out/*.apk rel/Atlas.apk
          python3 - "$V" "$C" "$GITHUB_SHA" <<'PY'
          import hashlib, json, os, sys
          v, code, sha = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          apk = "rel/Atlas.apk"
          h = hashlib.sha256(open(apk, "rb").read()).hexdigest()
          cl = json.load(open("/tmp/CHANGELOG.json"))
          notes = next((e.get("notes", []) for e in cl.get("versions", []) if e.get("version") == v), [])
          json.dump({"version": v, "versionCode": code, "url": "https://raw.githubusercontent.com/anjystar10/atlas/releases/Atlas.apk",
                     "sha256": h, "size": os.path.getsize(apk), "notes": notes, "builtFrom": sha}, open("rel/latest.json", "w"), indent=1)
          PY
          cat rel/latest.json
          git switch --orphan releases-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp rel/Atlas.apk rel/latest.json .
          git add -f Atlas.apk latest.json
          git commit -m "Release $V ($C) from ${GITHUB_SHA::7}"
          git push -f origin releases-tmp:releases

      - name: Attach to a GitHub release
        # optional: some repos don't let workflows create releases; the apk-builds branch always has the APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' <(git show "$GITHUB_SHA:app/build.gradle.kts") | head -1)
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Atlas ${V} build ${{ github.run_number }}" \
            --notes "Debug build from commit ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
