name: Emulator smoke test

on:
  workflow_dispatch:
    inputs:
      note:
        description: Why this run (optional)
        required: false
  workflow_run:
    workflows: [Build Atlas APK]
    types: [completed]

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pick the APK
        # the newest APK lives on the apk-builds branch, with the commit it was built from
        run: |
          git fetch --depth 1 origin apk-builds
          mkdir -p apk
          git show FETCH_HEAD:Atlas-latest.apk > apk/Atlas-latest.apk
          BUILT=$(git show FETCH_HEAD:built-from.txt 2>/dev/null || echo unknown)
          echo "TAG=${BUILT:0:7}" >> "$GITHUB_ENV"
          echo "APK built from $BUILT"
          ls -la apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/smoke.sh

      - name: Publish results
        if: always()
        run: |
          [ -d smoke-out ] || exit 0
          git config user.name "atlas-ci"
          git config user.email "atlas-ci@users.noreply.github.com"
          mkdir -p /tmp/res && cp -r smoke-out/* /tmp/res/
          git switch --orphan smoke-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p results && cp -r /tmp/res/* results/
          echo "$TAG" > results/tag.txt
          git add -f results
          git commit -qm "Smoke results for $TAG"
          git push -f origin smoke-tmp:smoke-results
