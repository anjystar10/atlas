name: Voice lab

# Generates Atlas's candidate voices on CPU runners, scores them (UTMOS naturalness, Whisper word error rate, speaker
# similarity), masters them, and commits the results to the voice-lab-results branch. Runs when the voice-lab branch
# is pushed, or by hand.
on:
  push:
    branches: [voice-lab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the models
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Qwen3-TTS (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-fmt-all > /dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U qwen-tts soundfile
      - name: Design three voices and check cloning
        run: python tools/voicelab/lab.py design out
      - uses: actions/upload-artifact@v4
        with: { name: qwen, path: out, retention-days: 3 }

  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Kokoro (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro soundfile
      - run: python tools/voicelab/lab.py kokoro out
      - uses: actions/upload-artifact@v4
        with: { name: kokoro, path: out, retention-days: 3 }

  chatterbox:
    needs: qwen
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the models
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Chatterbox (CPU)
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts soundfile
      - uses: actions/download-artifact@v4
        with: { name: qwen, path: out }
      - name: Re-voice each designed voice with Chatterbox
        run: |
          mkdir cb && cp out/qwen-design-*1.wav cb/
          python tools/voicelab/lab.py chatter cb
          rm cb/qwen-design-*
      - uses: actions/upload-artifact@v4
        with: { name: chatterbox, path: cb, retention-days: 3 }

  score:
    needs: [qwen, kokoro, chatterbox]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install scoring tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q librosa soundfile jiwer faster-whisper resemblyzer
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: qwen, path: out }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: kokoro, path: out }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: chatterbox, path: out }
      - name: Score, master and report
        run: python tools/voicelab/lab.py score out
      - name: Publish to the voice-lab-results branch
        run: |
          cd out
          for f in finished/*-finished.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 160k "${f%.wav}.mp3"; done
          git init -q && git checkout -q -b voice-lab-results
          git config user.name atlas-ci && git config user.email atlas-ci@users.noreply.github.com
          git add -A && git commit -q -m "Voice lab results from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voice-lab-results
