# Builds Atlas for Windows, checks it on a real Windows machine, and publishes the installer.
name: Build Atlas for Windows
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Run Atlas, take screenshots, try the PC tools
        shell: pwsh
        env:
          ATLAS_SHOT: ${{ github.workspace }}\desktop\shots\shot.png
          ATLAS_WAIT: '4000'
          ATLAS_PCTEST: '1'
          ATLAS_STEPS: '["document.querySelector(\"[data-tab=log]\").click()","document.querySelector(\"[data-tab=me]\").click()"]'
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath "dist\win-unpacked\Atlas.exe" -PassThru -RedirectStandardOutput shots\out.txt -RedirectStandardError shots\err.txt
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force }
          Get-Content shots\out.txt
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        with: { name: windows-check, path: desktop/shots/ }
      - name: Publish the installer
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: pwsh
        run: |
          $notes = "Atlas for Windows, built from ${{ github.sha }}."
          gh release view desktop 2>$null; if ($LASTEXITCODE -ne 0) { gh release create desktop --title "Atlas for Windows" --notes $notes --latest=false }
          gh release upload desktop dist\Atlas-Setup.exe --clobber
          gh release edit desktop --notes $notes
      - name: Keep the screenshots on the windows-results branch
        shell: pwsh
        run: |
          git config user.name "atlas-ci"; git config user.email "atlas-ci@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "wr"; New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item desktop\shots\* $tmp
          git fetch origin windows-results 2>$null
          git checkout --orphan windows-results-new
          git rm -rf --quiet . 2>$null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          New-Item -ItemType Directory results | Out-Null
          Copy-Item "$tmp\*" results\
          "${{ github.sha }}" | Out-File results\tag.txt
          git add results; git commit -q -m "Windows check for ${{ github.sha }}"
          git push -q -f origin HEAD:windows-results
        working-directory: ${{ github.workspace }}
