<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Atlas orb</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    #o { position: absolute; inset: 6px; cursor: pointer; }
    .orb { width: 100% !important; height: 100% !important; }
    .orb canvas, .orb img { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="o"></div>
  <script type="module" src="orb-float.js"></script>
</body>
</html>
